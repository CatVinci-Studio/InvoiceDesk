name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS is Apple Silicon only, matching Levis's matrix.
          #
          # An Intel entry was here briefly and has been dropped. The reason
          # it is not worth its slot: an arm64 build cannot run on an Intel
          # Mac (Rosetta translates x86 to arm, never the other way), so
          # supporting Intel means a genuinely separate build, a second cold
          # compile of rusqlite's bundled SQLite, and a second artifact on the
          # release page that most visitors have to read past. Apple stopped
          # selling Intel Macs in 2023.
          #
          # If Intel is wanted again, add back:
          #   - platform: macos-latest
          #     target: x86_64-apple-darwin
          #     args: --target x86_64-apple-darwin
          # tauri-action names the macOS updater bundle per architecture, so
          # the two jobs cannot collide on an asset name, and latest.json is
          # merged rather than replaced - each job re-downloads the copy
          # already on the release and adds its own platform key.
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin

          # Windows ships the NSIS .exe and nothing else; the target list
          # itself lives in src-tauri/tauri.windows.conf.json, so a local
          # `tauri build` produces the same one artifact this does.
          #
          # It used to bundle MSI as well on stable tags, and that is what
          # made Windows upgrades ask to uninstall first: the two installers
          # register in different places, so neither recognises the other's
          # copy - take the .msi once and the next .exe cannot replace it.
          # MSI also cannot build a pre-release at all ("optional pre-release
          # identifier in app version must be numeric-only ... for msi
          # target"), so rc tags were NSIS-only regardless, and the updater
          # has always shipped NSIS. One installer, one upgrade path.
          - platform: windows-latest
            target: ""
            args: ""

          # No Linux. InvoiceDesk targets Windows and macOS only, so there is no
          # ubuntu entry and no webkit2gtk/libappindicator apt step anywhere
          # in this file. Adding Linux back means restoring both.

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Empty on Windows, where the host triple is already the build
          # target and rustup needs nothing extra installed.
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          # Keyed by target so the macOS and Windows jobs cannot restore each
          # other's target dir. Matters more than usual here: rusqlite
          # `bundled` recompiles the SQLite amalgamation from C, which is the
          # slowest thing in the build.
          key: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (latest.json + .sig files) so
          # installed apps can verify downloads against the pubkey baked
          # into tauri.conf.json. Not optional here: bundle
          # `createUpdaterArtifacts` is true, so a missing key fails the
          # build rather than quietly publishing an un-updatable release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          #
          # NO macOS code signing or notarization. Unlike Levis, which carries
          # an Apple Developer identity and notarizes every build, InvoiceDesk
          # ships a plain unsigned .dmg - which is a deliberate choice, not an
          # omission, and it has exactly one visible consequence:
          #
          #   Gatekeeper refuses the first launch with "无法打开，因为无法验证
          #   开发者". The way past it is 右键点应用 → 打开 → 在弹窗里再点
          #   「打开」, once, ever.
          #
          # That instruction has to be in the README and the manual, because a
          # user who does not know it concludes the download is broken. If an
          # Apple identity is added later, the six APPLE_* secrets go back
          # here and the note comes out of the docs - see docs/RELEASE.md.
          #
          # Windows is unaffected: it was never signed either, and SmartScreen
          # shows its own "更多信息 → 仍要运行" prompt for the same reason.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "InvoiceDesk ${{ github.ref_name }}"
          # Publish immediately on tag - a draft release's latest.json is
          # invisible to the in-app updater, so drafts left unpublished
          # silently stall every user on the previous version.
          releaseDraft: false
          # A semver pre-release suffix (v0.9.0-rc.1, -beta.2, -alpha) marks
          # the GitHub release as a pre-release. That is what keeps it away
          # from everyone else: the updater endpoint in tauri.conf.json points
          # at `releases/latest/...`, and GitHub's "latest" excludes
          # pre-releases - so a stable install never even sees this build's
          # latest.json. Without this the tag pattern below (v*.*.*) matches
          # an rc tag too and would ship it to every user as the new stable.
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

  # A Homebrew cask job would go here, as a second job with
  # `needs: release` and `if: !contains(github.ref_name, '-')` - a cask has no
  # channel of its own, so pointing it at an rc would hand that build to every
  # `brew upgrade`, the same mistake `prerelease:` above exists to prevent. It
  # would rewrite version + sha256 in Casks/invoice-desk.rb against
  # Invoice Desk_<version>_aarch64.dmg and push over a deploy key, since
  # GITHUB_TOKEN cannot write to another repository.
  #
  # Omitted because CatVinci-Studio has no tap for InvoiceDesk yet. See Levis's
  # release.yml for a working copy of the job.
