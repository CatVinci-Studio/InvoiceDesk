[package]
name = "aicompat"
version = "0.1.0"
edition = "2021"
description = "OpenAI-compatible API client layer for InvoiceDesk's invoice recognition"

[dependencies]
# rustls rather than native-tls so the binary carries its own TLS stack and
# does not depend on the host's certificate plumbing; `stream` is what makes
# SSE (streaming responses) possible.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "socks",
    "stream",
] }
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
