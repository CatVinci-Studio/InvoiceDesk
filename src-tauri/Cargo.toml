[package]
name = "invoice-desk"
version = "0.0.4"
description = "智票 (InvoiceDesk) - 发票扫描、分类统计与报销表生成"
authors = ["CatVinci Studio"]
edition = "2021"

[workspace]
members = ["crates/aicompat"]
resolver = "2"

[lib]
# The `_lib` suffix may seem redundant but it is necessary to make the lib
# name unique and avoid conflicting with the bin name on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "invoice_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "sync", "macros", "rt"] }
base64 = "0.22"
aicompat = { path = "crates/aicompat" }

# --- Invoice extraction ------------------------------------------------
#
# The pipeline is layered by how trustworthy each source is (see
# extract/mod.rs), and each layer needs its own reader:
#
#   lopdf        the PDF object graph - used to pull EMBEDDED FILES out of
#                the Names/EmbeddedFiles tree. 数电票 (fully-digital
#                invoices) are frequently delivered as a PDF with the
#                authoritative invoice XML attached inside it; when that
#                attachment is there it beats every other source outright,
#                so it is worth reaching into the object graph for.
#   pdf-extract  the PDF text layer. Electronic invoices are generated
#                PDFs, not scans, so the field values are real text - free,
#                offline, and exact when it works.
#   zip +        OFD (GB/T 33190) is China's own document format and the
#   quick-xml    other half of what tax platforms hand out. It is a zip of
#                XML parts, so it needs no dedicated crate - the same pair
#                Levis uses for docx/pptx reads it.
#   rxing        QR decoding (a Rust port of ZXing). Every VAT invoice
#                carries a QR code encoding 票种/代码/号码/金额/日期, which
#                is the one thing on a crooked phone photo that either
#                decodes exactly or not at all - unlike OCR, it cannot
#                hand back a confident wrong digit.
#   image        loading and preprocessing the photo before QR detection.
#   encoding_rs  QR payloads and OFD parts are not reliably UTF-8; GB18030
#                shows up in both.
lopdf = { version = "0.44", default-features = false, features = ["chrono"] }
pdf-extract = "0.12"
zip = { version = "4", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
# `encoding_rs` is required, not optional: without a character-set backend
# rxing refuses to build, and it is the right backend here anyway - invoice
# QR payloads are not always UTF-8.
rxing = { version = "0.9", default-features = false, features = [
    "image",
    "decoders",
    # Scanning for SEVERAL codes matters: invoices get photographed next to
    # WeChat codes and payment stickers, and the invoice's own QR is not
    # always the first one the detector locks onto.
    "multi_barcode_readers",
    "encoding_rs",
] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "bmp",
    "gif",
    "tiff",
    "webp",
] }
encoding_rs = "0.8"

# --- Storage, matching, output ----------------------------------------
#
#   rusqlite     the local invoice ledger. `bundled` compiles SQLite in, so
#                the app never depends on the host's copy - and the ledger
#                is what makes duplicate-reimbursement detection possible
#                across reports and across months.
#   rust_xlsxwriter  writes the reimbursement workbook.
#   calamine     reads a company's own .xlsx template so its cells can be
#                mapped to invoice fields. Already proven in Levis.
#   regex/chrono field parsing and date normalisation.
# Pinned below 0.40: that line pulls libsqlite3-sys 0.38.1, whose build
# script uses the unstable `cfg_select!` macro and therefore does not build
# on stable Rust. Dates are stored as TEXT here, so rusqlite's own chrono
# integration is not needed either.
rusqlite = { version = "0.37", features = ["bundled"] }
# File-content hashing, so re-importing the same FILE is caught even when
# extraction failed and there is no 发票号码 to dedupe on.
sha2 = "0.10"
rust_xlsxwriter = "0.97"
calamine = "0.36"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
